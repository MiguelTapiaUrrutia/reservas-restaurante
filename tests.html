<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tests — La Mesa del Bío Bío</title>
  <style>
    /* Estilos mínimos solo para leer los tests; la app usa css/styles.css */
    body {
      font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
      max-width: 60rem;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #faf6f0;
      color: #2b2118;
    }
    #lista-tests { list-style: none; padding: 0; }
    #lista-tests li { padding: 0.35rem 0.75rem; border-radius: 4px; margin-bottom: 2px; }
    .test-pasa { background: #e3efe3; color: #1e4620; }
    .test-falla { background: #f7dcd7; color: #7a1c10; font-weight: bold; }
    #resumen { font-size: 1.25rem; font-weight: bold; padding: 0.75rem; border-radius: 6px; }
    .resumen-ok { background: #1e4620; color: #e3efe3; }
    .resumen-error { background: #7a1c10; color: #f7dcd7; }
  </style>
</head>
<body>
  <header>
    <h1>Suite de tests — La Mesa del Bío Bío</h1>
  </header>

  <main>
    <ul id="lista-tests"></ul>
    <p id="resumen">Ejecutando…</p>
  </main>

  <!-- El orden importa: reglas.js usa funciones de fechas.js -->
  <script src="js/fechas.js"></script>
  <script src="js/reglas.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/tests.js"></script>
</body>
</html>
